id: T15
name: Yield Optimizer
track: Hard
points: 200
toolkit: DeFi / Portfolio
network: Pharos Atlantic testnet (chain id 688689) ONLY. Never mainnet.
budget_phrs: 0.15
status: built — live evidence on Atlantic

official_requirements:
  - Compares >=3 yield sources on LIVE on-chain data.
  - Accounts for gas + entry/exit fees + minimum holding period.
  - Outputs clear recommendation with expected net gain, or 'stay put' with reason.
  - If executing: prepares txs for USER SIGNATURE ONLY - agent never holds keys.

design:
  discovery: >
    Venue DISCOVERY module enumerates what yield venues actually exist on
    Atlantic (eth_getCode probes + recent-block contract-creation scan).
    Finding: ZERO third-party yield venues exist (chain near-idle).
    The empty result IS the finding, documented in runs/discovery.json.
  venues: >
    3 live on-chain rate sources: OctopusVault A "Kelp" (1e13 wei/block,
    0bps entry, 50bps early exit, 100-block min hold) and OctopusVault B
    "Kraken" (2.5e13 wei/block, 100bps entry, 100bps early exit, 400-block
    min hold) - both builder-deployed, fully disclosed testnet fixtures with
    immutable on-chain rate cards - plus the "stay put" wallet baseline (0%).
  net_math: >
    net(H) = rewardPerBlock*min(H,runway)*share - entryFee - exitFee(H) - gas.
    APY from MEASURED block time. Runway-capped gross (vault can't pay more
    than funded). Fee-sensitivity tested at two horizons (the flip is real).
  execution: >
    Optimizer module is key-free (CI grep gate). Unsigned deposit tx via
    optimizer/prepare.py for user signature. Live evidence run (stake/claim/
    withdraw) executed by the OPERATOR via flock-wrapped `cast send`, dust
    amounts, outside the module.

honesty_label: TESTNET MECHANICS DEMONSTRATION - rewards are valueless testnet PHRS, never real yield.

deliverables:
  - task.yaml, REQUIREMENTS.md, README.md, REVIEWER_NOTES.md, LINKS.md
  - SUBMISSION.md, VIDEO-GUIDE.md, evidence.md, evidence.json
  - src/OctopusVault.sol, script/DeployVault.s.sol, test/OctopusVault.t.sol
  - optimizer/{common,discover,scan,optimize,prepare}.py, tests/test_optimizer.py
  - runs/{discovery,scan,recommendation,unsigned_deposit,live_run}.json

tests:
  forge: 8 unit tests (rate accrual exactness, pro-rata, pool cap, fees, views)
  python: 12 unit tests (net math, runway cap, stay-put logic, unsigned-tx shape, key hygiene)
  live: stake -> claim -> withdraw on Atlantic with balance deltas matching on-chain rate math
