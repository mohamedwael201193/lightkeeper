description: >
  A builder agent that plans strictly from retrieved Pharos documentation.
  5-stage pipeline: INTAKE -> docs research (local corpus crawl of
  pharos.xyz llms.txt + .md pages, URL + date + excerpt citations) ->
  cited PLAN rendered before acting -> COVERAGE CHECK (every step must trace
  to a cited passage; uncovered steps are UNVERIFIED and the agent REFUSES
  them with a reason instead of improvising) -> real EXECUTION of the covered
  plan -> on-chain VERIFY -> verdict report. Citation discipline:
  DOC-GROUNDED / INFERENCE / UNVERIFIED (MEGA §228).

