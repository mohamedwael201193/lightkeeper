# LIGHTKEEPER task manifest — T16 Liquidation Watchdog
task_id: T16
slug: liquidation-watchdog
name: Liquidation Watchdog
tier: Medium
points: 100
toolkit: DeFi / Portfolio
status: shipped
owner: devmo (build agent)

description: >
  A liquidation watchdog for a minimal on-chain lending pool (MiniLend) on
  Pharos Atlantic. The pool computes a REAL Aave-style health factor on-chain
  (collateral vs USD-denominated debt, 80% liquidation threshold, operator
  price feed). The watcher reads collateral/debt/HF live via
  getUserAccountData, evaluates against configurable warn (1.3) / critical
  (1.1) thresholds, and delivers a transition-only Telegram alert carrying a
  CONCRETE action (repay $X of debt OR add Y PHRS collateral to restore
  HF >= 1.5). Proven end-to-end on Atlantic: healthy position -> real
  on-chain price drop -> WARNING alert delivered (Telegram message 716) ->
  real repay -> RECOVERED, with no duplicate alerts.

deliverables:
  - src/MiniLend.sol        # lending pool: real on-chain health-factor math
  - test/MiniLend.t.sol     # 9 forge unit tests of the HF math (all pass)
  - watcher/watch.py        # the watchdog: live read -> zone eval -> 1 alert
  - watcher/config.yaml     # thresholds, contract, watched position
  - watcher/watcher.log     # real detection run with timestamps
  - watcher/state.json      # transition-only state (last zone)
  - foundry.toml
  - lib/forge-std           # test dependency (vendored)
  - REQUIREMENTS.md         # official requirements quoted verbatim
  - README.md               # 8 sections, opens with OCTOPUS header
  - evidence.md / evidence.json  # 5 real txs, Telegram message_id, spend log
  - REVIEWER_NOTES.md
  - LINKS.md                # curl-verified links
  - SUBMISSION.md           # exact copy-paste Arena pack
  - VIDEO-GUIDE.md          # 45-90s filming guide

