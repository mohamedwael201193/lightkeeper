# T21 Whale-Watching Agent — configuration
# Secrets are NEVER stored here. RPC comes from $ATLANTIC_RPC_URL.

network:
  name: atlantic-testnet
  chainId: 688689
  rpcUrl: https://atlantic.dplabs-internal.com
  explorerTx: https://atlantic.pharosscan.xyz/tx

# A native transfer >= this value is a "whale" event.
native_threshold_phrs: 0.05
threshold_justification: >-
  Measured from real Atlantic traffic: a 100-block sample (31481230-31481329)
  contained only 3 value-carrying transactions, max 0.01 PHRS (median 0.01).
  Threshold 0.05 PHRS = 5x the observed max: anything at/above it is a genuine
  outlier on this testnet. No USD conversion: no price feed exists on Atlantic.

# >=5 watched addresses. Labels describe ONLY what is verifiable on-chain;
# unknown identities are never invented (see label policy in README).
watchlist:
  - address: "0xf76e6B0920e9332fF4410f6dD53F01722AbC71a3"
    label: "LIGHTKEEPER deployer wallet (self, founder-authorized; 8 txs observed in blocks 31481888-31482007)"
  - address: "0x7D5Bbc5E294896860278134Da3898171043B2a5e"
    label: "T21 self-seed sink (task-controlled fresh address; recipient of the disclosed 0.05 PHRS test transfer, block 31482165)"
  - address: "0xec0aecf6c778f44aea12ee17afb38f4e0af0a2a4"
    label: "observed transactor, first seen block 31481905 (unlabeled; 2 txs, max 0.012 PHRS in sample)"
  - address: "0x95a16e1898b09cce5e03765baa55c8c112cb80c2"
    label: "observed transactor, first seen block 31481950 (unlabeled; max 0.003 PHRS in sample)"
  - address: "0x6f34a6f94f529bf10313ba77cc34314389dd204e"
    label: "observed transactor, first seen block 31481894 (unlabeled; max 0.001 PHRS in sample)"
  - address: "0x838800b758277cc111b2d48ab01e5e164f8e9471"
    label: "observed transactor, first seen block 31481931 (unlabeled; 2 txs, max 0.0005 PHRS in sample)"

# Disclosed test transfers executed by the builder. Real on-chain transfers,
# but NEVER presented as organic: reports mark them [SELF-SEEDED].
self_seeded_tx_hashes:
  - "0xf566e34c25ca3c32dc4f6c687b7345501ea8da065398d71e9b87bc246371ba70"

