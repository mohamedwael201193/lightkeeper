# LIGHTKEEPER task manifest — T05 Threshold Guardian
task_id: T05
slug: threshold-guardian
name: Threshold Guardian
tier: Medium
points: 100
toolkit: SkillEngine
status: shipped
owner: devmo (build agent)

description: >
  A policy gate that intercepts proposed transfers and BLOCKS any write that
  breaches configured thresholds. Implements the 4 mandatory SkillEngine
  Write Operation Pre-checks (network firewall, threshold gate,
  balance/allowance sufficiency, mainnet re-confirmation) as independent,
  configurable, on-chain-read conditions with a full decision trace per run.

deliverables:
