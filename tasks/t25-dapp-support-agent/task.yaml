task: T25
title: dApp Support Agent
slug: t25-dapp-support-agent
difficulty: Easy
points: 50
toolkit: Support / Reporting
network: Pharos Atlantic testnet
chain_id: 688689
status: built
built: "2026-10-16"

capabilities:
  - diagnose: "tx hash -> tx+receipt -> failure cause -> plain-language explanation + fix"
  - account: "address -> balance, tx count, EOA/contract, recent ERC-20 activity"
  - ask: "doc-grounded Q&A with DOC-GROUNDED / INFERENCE / UNVERIFIED labels + say-so path"

cause_branches:
  - not_found
  - pending_or_dropped
  - success
  - out_of_gas          # gasUsed == gasLimit, FAQ-cited fix
  - revert_with_reason  # Error(string) via eth_call replay at block-1
  - revert_panic        # Panic(uint256) with code meanings
  - revert_no_data
  - revert_custom       # unknown selector reported honestly
  - insufficient_balance     # pre-condition read at block-1
  - insufficient_allowance   # transferFrom heuristic, reads at block-1
  - insufficient_token_balance

evidence_txs:
  revert_with_reason: "0x405295cd89ef7469ded00bf6fe1ba99ab42739bc9154b10b9ed9641185c0ca23"
  out_of_gas: "0x31993dc871fea0f0788d2f8647f9f45749b0f4a5793053ddfcd9ae12d1f3f5cf"
  panic_overflow: "0x2c78309c41ce0bd53f611ac5a1ad5e2bfa0e29b7f5e3514b9f0a429c2dcab048"
  deploy_testreverter_v1: "0x719016bd20168bf8f7a3cd264a61e0a88925b467dba07cd5bc98c89c7be1d481"
  deploy_testreverter_v2: "0x48adea8bae24bcc9fa94f175e7a86c424c483f804599ada1dfd72a6ad5aec9e7"

contracts:
  testreverter_v2: "0xC987a20fEEDc38772cE0786c3233148586a67e53"
  testreverter_v1: "0x5C5803746A187727090a44FbAe2a956f3d2525a3"

spend_budget_phrs: 0.15
# actual spend logged in evidence.json

run:
  diagnose: "python3 src/support_agent.py diagnose 0x<txhash>"
  account: "python3 src/support_agent.py account 0x<address>"
  ask: "python3 src/support_agent.py ask \"<question>\""
  tests: "python3 tests/test_agent.py"

env:
  - ATLANTIC_RPC_URL  # from ~/workspace/lightkeeper/.env (never committed)

deps: []  # stdlib only
