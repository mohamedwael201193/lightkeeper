# LIGHTKEEPER task manifest — T17 Natural-Language Payment Agent
task_id: T17
slug: nl-payment-agent
name: Natural-Language Payment Agent
tier: Medium
points: 100
toolkit: Payments
status: shipped
owner: devmo (build agent)

description: >
  A natural-language payment agent for Pharos Atlantic. A deterministic,
  no-LLM slot-extraction parser turns free text ("send 0.01 PHRS to 0x…")
  into a structured payment plan — or a refusal/clarification when the input
  is ambiguous (never defaulted, never guessed). A chain validator checks
  recipient format, asserts Atlantic chain-id 688689, and confirms the
  balance covers amount + gas. A human-readable REVIEW card is rendered
  before an unsigned-tx artifact ("signed": false). Broadcast happens only
  behind an explicit CONFIRM <plan_id> gate bound to the reviewed plan hash
  (the human-in-the-loop wallet signing request), wrapped in flock
  nonce-safety, followed by receipt read-back verification.

deliverables:
  - agent.py                # CLI: new -> review -> confirm -> send
  - src/parse.py            # deterministic intent parser (no LLM, no signing code)
  - src/validate.py         # chain validation: checksum, chain-id, balance
  - src/review.py           # human-readable review card + unsigned tx
  - src/gate.py             # explicit CONFIRM <plan_id> gate
  - src/broadcast.py        # confirmed-only broadcaster (flock nonce lock)
  - src/verify.py           # receipt read-back verification
  - tests/test_parser.py    # 34 unit tests: valid/invalid/ambiguous/injection/notation-traps/rule-tags/no-signing
  - runs/                   # real run dirs: parse/review/confirm/execute/receipt + transcripts
  - task.yaml
  - REQUIREMENTS.md         # official requirements quoted verbatim
  - README.md               # 8 sections, opens with OCTOPUS header
  - evidence.md / evidence.json  # real tx hashes, spend log, curl-tested links
  - REVIEWER_NOTES.md
  - LINKS.md                # curl-verified links
  - SUBMISSION.md           # exact copy-paste Arena pack
  - VIDEO-GUIDE.md          # 45-90s filming guide

budget:
  max_phrs: 0.15
  spent_phrs: 0.027063   # 3 dust txs + gas; see evidence.json spend_log

evidence:
  atlantic_explorer: https://atlantic.pharosscan.xyz/
  txs: []                # filled in evidence.json
