id: T04
slug: doc-search-cli
title: Doc-Search CLI
track: Pharos Season of AI Agent Arena
difficulty: Easy
base_points: 50
video_bonus: 50
toolkit: Developer Docs MCP
status: built
commit: 9ec5f2169a1cf97da891a0055156e6d51a185651

summary: >
  A stdlib-only CLI (`pharos-docs`) that answers Pharos developer questions
  from a LOCAL passage index built from the live docs (llms.txt +
  llms-full.txt + sitemap, fetched 2026-10-16). BM25 retrieval with synonym
  expansion, recommendation boost, and an honest-miss gate. Every answer
  carries exactly one citation label: DOC-GROUNDED (doc URL + retrieval date
  + verbatim excerpt), INFERENCE (explicitly marked synthesis), or UNVERIFIED
  (exit 2, no invented content). NOT a thin HTTP wrapper around the GitBook
  ?ask= endpoint.

deliverables:
  - task.yaml
  - REQUIREMENTS.md
  - README.md
  - evidence.md
  - evidence/evidence.json
  - evidence/run_evidence.py
  - evidence/transcripts/
  - REVIEWER_NOTES.md
  - LINKS.md
  - SUBMISSION.md
  - VIDEO-GUIDE.md
  - pharos-docs
  - src/build_index.py
  - fetch_corpus.sh
  - index/index.json
  - corpus/
  - tests/test_cli.py
  - tests/probe_scores.py

evidence:
  log: evidence.md §1 + evidence/evidence.json (9 queries: 7 grounded, 2 honest misses)
  replay: python3 evidence/run_evidence.py
  tests: python3 -m unittest tests.test_cli  (14 tests, all pass)

constraints:
  - no mock/demo/placeholder/fake success; never fabricate doc content
  - no secrets in repo; read-only task; spend 0 PHRS (budget cap 0.15)
  - CLI makes zero network calls at answer time (local index)

notes: >
  The GitBook ?ask= endpoint was reachable (HTTP 200) during this build but
  has 403'd before (verdict team, first-hand) and is undocumented; the CLI
  deliberately does not depend on it. Retrieval date for all citations:
  2026-10-16.
