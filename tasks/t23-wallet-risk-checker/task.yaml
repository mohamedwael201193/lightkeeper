# LIGHTKEEPER task manifest — T23 Wallet Risk Checker
task_id: T23
slug: wallet-risk-checker
name: Wallet Risk Checker
tier: Medium
points: 100
toolkit: Compliance / Security
status: shipped
owner: devmo (build agent)

description: >
  A read-only wallet risk checker for Pharos Atlantic testnet. For a given
  address it runs 8 real on-chain checks (account age via first-activity
  block, tx count / funding pattern, native balance, contract-vs-EOA with
  code-verification status, recent activity window, interaction diversity
  from Transfer logs, approval hygiene from Approval logs, flagged-address
  watchlist) and emits a per-check PASS / FLAG / UNKNOWN / N/A report with
  raw values and plain-language explanations, plus a DISCLOSED-HEURISTIC
  composite risk level (LOW/MED/HIGH) derived by a printed formula.
  No invented scores: every number is a live chain read, every heuristic is
  labeled HEURISTIC, and unrun checks are never reported as clean.

deliverables:
  - src/check.mjs            # the checker (stdlib-only Node, JSON-RPC, read-only)
  - bin/run.mjs              # CLI entry
  - signals.yaml             # heuristic thresholds + watchlist (documented)
  - test/run-tests.mjs       # live tests: checker raw values vs direct cast queries
  - fixture/                 # T23RiskFixture.sol + foundry project (risky-demo contract)
  - sample-output/           # real report JSONs from the evidence runs
  - REQUIREMENTS.md          # official requirements quoted verbatim
  - README.md                # 8 sections, opens with OCTOPUS header
  - evidence.md / evidence.json  # real check reports with block numbers, spend log
  - REVIEWER_NOTES.md
  - LINKS.md                 # curl-verified links
  - SUBMISSION.md            # exact copy-paste Arena pack
  - VIDEO-GUIDE.md           # 45-90s filming guide

budget:
  max_phrs: 0.15
  spent_phrs: 0.001265401000265401   # fixture deployments + funding; see evidence.json

evidence:
