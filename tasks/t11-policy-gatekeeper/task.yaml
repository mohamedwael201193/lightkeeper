# LIGHTKEEPER task manifest — T11 Policy Gatekeeper
task_id: T11
slug: policy-gatekeeper
name: Policy Gatekeeper
tier: Medium
points: 100
toolkit: SkillEngine
status: shipped
owner: devmo (build agent)

description: >
  A pre-execution policy engine for agent write actions: 8 named rules
  (action/network/selector/token/destination allowlists, per-action caps,
  time window, cooldown) over a versioned, hash-stamped policy.json;
  APPROVE mints an audit-backed gate stamp, DENY names the rule, mainnet
  is REFUSED outright. Append-only hash-chained audit trail of every
  decision. The 4 mandatory SkillEngine Write Operation Pre-checks enforced
  on the execute path. Differs from T05 (amount thresholds) by deciding on
  action policy.

deliverables:
  - policy.json            # versioned policy (hash stamped into every audit entry)
  - gatekeeper.py          # evaluate -> stamp; execute (pre-checks + stamp + broadcast)
  - tests/test_policy_engine.py  # 22 unit tests: every rule type, fail-closed, mainnet, no-bypass, chain tamper
  - audit/check-log.jsonl  # append-only hash-chained decision log (5 entries)
  - run-logs/              # deny.log, approve-evaluate.log, nobypass.log, mainnet-refusal.log, approve-execute.log, audit-verify.log
  - REQUIREMENTS.md        # official requirements quoted verbatim
  - README.md              # 8 sections, opens with OCTOPUS header
  - evidence.md / evidence.json  # real tx hash, spend log, curl-tested links
  - LINKS.md               # curl-verified links
  - SUBMISSION.md          # exact copy-paste Arena pack

