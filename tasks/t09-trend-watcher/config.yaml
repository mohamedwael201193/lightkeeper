# t09-trend-watcher — operational parameters (no secrets; chain reads via the Chain MCP)
# Metric: baseFeePerGas per block, read LIVE from Pharos mainnet (1672) via the
# Chain MCP tools get_block_number / get_block (one named MCP call per block;
# the MCP exposes no feeHistory tool — each point is a real block-header value).
# The trend math is defined in src/trend.mjs; these are the explicit parameters.

metric: baseFeePerGas            # per-block series via Chain MCP get_block (real on-chain values)
mcpEndpoint: https://mcp.pharos.xyz/mcp   # the ONLY chain transport; rawRpcCalls = 0 by construction
expectedChainId: 1672           # Pharos mainnet — the only chain the hosted Chain MCP serves; abort on any other chain

window:
  historyBlocks: 30             # get_block lookback per observe cycle

trend:
  fastWindow: 5                 # samples for the fast moving average
  slowWindow: 15                # samples for the slow moving average
  bandBps: 50                   # 0.5%: fastMA must exceed slowMA*(1+band) to count "above threshold"
  confirmations: 3              # N consecutive above-band samples required to FIRE
  cooldownBlocks: 20            # after a FIRE, no new FIRE within this many blocks

poll:
  intervalSec: 6                # live-run cadence between get_gas_price spot polls (~1 block)
  liveSamples: 5                # get_gas_price spot polls per observe cycle (context only, not in MA math)

report:
  contextUnit: gwei            # display unit for the human report (math stays in wei BigInt)

state:
  dir: state
  observations: observations.jsonl
  runtime: runtime.json
  audit: audit.jsonl
