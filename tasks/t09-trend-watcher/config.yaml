# t09-trend-watcher — operational parameters (no secrets; RPC comes from env)
# Metric: baseFeePerGas per block, read live from eth_feeHistory on Atlantic (688689).
# The trend math is defined in src/trend.mjs; these are the explicit parameters.

metric: baseFeePerGas            # per-block series via eth_feeHistory (real on-chain values)
rpcEnv: ATLANTIC_RPC_URL        # never hardcode an endpoint here
expectedChainId: 688689         # Atlantic testnet; abort on any other chain

window:
  historyBlocks: 30             # eth_feeHistory lookback per observe cycle

trend:
  fastWindow: 5                 # samples for the fast moving average
  slowWindow: 15                # samples for the slow moving average
  bandBps: 50                   # 0.5%: fastMA must exceed slowMA*(1+band) to count "above threshold"
  confirmations: 3              # N consecutive above-band samples required to FIRE
  cooldownBlocks: 20            # after a FIRE, no new FIRE within this many blocks

poll:
  intervalSec: 6                # live-run cadence between eth_gasPrice spot polls (~1 block)
  liveSamples: 5                # eth_gasPrice spot polls per observe cycle (context only, not in MA math)

report:
  contextUnit: gwei            # display unit for the human report (math stays in wei BigInt)

state:
  dir: state
  observations: observations.jsonl
  runtime: runtime.json
  audit: audit.jsonl
