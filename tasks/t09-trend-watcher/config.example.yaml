# Copy to config.yaml and tune. No secrets belong here (RPC via ATLANTIC_RPC_URL env).
metric: baseFeePerGas
rpcEnv: ATLANTIC_RPC_URL
expectedChainId: 688689

window:
  historyBlocks: 30

trend:
  fastWindow: 5
  slowWindow: 15
  bandBps: 50
  confirmations: 3
  cooldownBlocks: 20

poll:
  intervalSec: 6
  liveSamples: 5

report:
  contextUnit: gwei

state:
  dir: state
  observations: observations.jsonl
  runtime: runtime.json
  audit: audit.jsonl
