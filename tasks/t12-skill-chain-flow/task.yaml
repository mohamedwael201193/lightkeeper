description: >
  One end-to-end composition flow reproducing the portal pattern: live
  Chain MCP-class reads (chainId, pinned block, native balance, gas price,
  pingCount(), keeper()) feed verbatim into a SkillEngine preflight skill;
  the skill's ALLOW/BLOCK verdict gates a real dust tx; a follow-up chain
  query verifies the post-state. Dependency is proven by contrast runs:
  0.0001 PHRS → ALLOW + execute + pingCount 0→1, versus 0.1 PHRS → BLOCK
  quoting the same live balance, no broadcast, pingCount unchanged.

