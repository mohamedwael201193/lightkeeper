# LIGHTKEEPER task manifest — T28 Multi-Protocol Aggregator
task_id: T28
slug: multi-protocol-aggregator
name: Multi-Protocol Aggregator
tier: Hard
points: 200
toolkit: Cross-tool / Advanced
status: shipped
owner: devmo (build agent)

description: >
  One interface over N fault-isolated on-chain venues: a protocol REGISTRY
  (local JSON, seeded by a bytecode-verifying discovery run), a live
  aggregator that pins one block and reads ≥3 protocols in a single run
  (vaults + lending: TVL, APYs, share price, utilization), a normalized
  comparison view (capital efficiency / risk), a policy-weighted router that
  picks the best venue per intent and EXPLAINS WHY with traced numbers, and
  unsigned action preparation with an eth_call dry-run revert gate.
  A venue that fails is marked UNREACHABLE — never zero-filled; one protocol
  down does not break the others (proven by a labeled chaos run).

deliverables:
  - src/SimpleVault.sol        # minimal payable share vault (2 venues, real math)
  - src/SimpleLending.sol      # minimal supply/borrow pool (utilization curve)
  - registry.json              # protocol registry: 3 live T28 venues + 5 PENDING siblings
  - aggregate.py               # discover|run|route|prepare|health|chaos
  - tests/test_normalize.py    # 10 unit tests: normalization, risk, comparison
  - runs/                      # live run artifacts (discovery, reports, routes, chaos)
  - task.yaml
  - REQUIREMENTS.md            # official requirements quoted verbatim
  - ARCHITECTURE.md            # architecture write-up (strongly encouraged at tier)
  - README.md                  # 8 sections, opens with OCTOPUS header
  - evidence.md / evidence.json  # real tx hashes, spend log, curl-tested links
  - REVIEWER_NOTES.md
  - LINKS.md                   # curl-verified links
  - SUBMISSION.md              # exact copy-paste Arena pack
  - VIDEO-GUIDE.md             # 45-90s filming guide

